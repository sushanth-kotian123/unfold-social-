<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unfold Social</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f9f6f1;
  --dark: #141210;
  --terracotta: #c4613a;
  --sand: #e8ddd0;
  --muted: #7a6e65;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--dark);
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 72px;
  background: rgba(249,246,241,0.95);
  backdrop-filter: blur(10px);
}

.nav-logo { height: 42px; }

.nav-links {
  display: flex;
  gap: 32px;
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  color: var(--muted);
  font-size: 13px;
}

.nav-btn {
  background: var(--terracotta);
  color: white;
  padding: 10px 22px;
  border-radius: 50px;
  text-decoration: none;
  font-size: 13px;
}

/* HERO */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
  padding-top: 80px;
  max-width: 1400px;
  margin: auto;
}

.hero-left {
  padding: 80px 72px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 64px;
  margin-bottom: 20px;
}

.hero p {
  color: var(--muted);
  margin-bottom: 30px;
}

.hero-right {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 80px 72px;
}

.mosaic-item {
  border-radius: 12px;
  overflow: hidden;
}

.mosaic-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* FOOTER */
footer {
  background: var(--dark);
  color: white;
  padding: 30px 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-logo {
  height: 34px;
  opacity: 0.8;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <img src="logonew.png" class="nav-logo">
  <ul class="nav-links">
    <li><a href="#">Experiences</a></li>
    <li><a href="#">Highlights</a></li>
    <li><a href="#">Gallery</a></li>
  </ul>
  <a href="https://wa.me/917676596695" class="nav-btn">Enquire Now</a>
</nav>

<!-- HERO -->
<section class="hero">

  <div class="hero-left">
    <h1>Creative Experiences</h1>
    <p>Workshops and social events designed to bring people together.</p>
    <a href="#" class="nav-btn">Explore</a>
  </div>

  <div class="hero-right">
    <div class="mosaic-item"><img src="Perfume_Making_District.jpg"></div>
    <div class="mosaic-item"><img src="Japaneese_Kintsugi_District.jpg"></div>
    <div class="mosaic-item"><img src="Mandala.jpg"></div>
    <div class="mosaic-item"><img src="Resin_Art_District.jpg"></div>
  </div>

</section>

<!-- FOOTER -->
<footer>
  <img src="logonew.png" class="footer-logo">
  <span>© 2026 Unfold Social</span>
</footer>

</body>
</html>
